  <animateMotion dur="10s" repeatCount="indefinite" begin="-6.25s"
    path="M420,125 m-230,0 a230,78 0 1,0 460,0 a230,78 0 1,0 -460,0"/>
  <g filter="url(#cg)">
    <animateTransform attributeName="transform" type="scale"
      values="0.55,0.55; 0.85,0.85; 1.3,1.3; 0.85,0.85; 0.55,0.55"
      keyTimes="0;0.25;0.5;0.75;1" dur="10s" begin="-6.25s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.6;1;0.6;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="10s" begin="-6.25s" repeatCount="indefinite"/>
    <rect x="-25" y="-36" width="50" height="72" rx="6" fill="url(#cf)" stroke="url(#r2)" stroke-width="1.8"/>
    <rect x="-23" y="-34" width="46" height="68" rx="4" fill="url(#bp)"/>
    <text x="0" y="8" font-family="'Courier New',monospace" font-size="36" fill="#7c4dff" text-anchor="middle" font-weight="bold">0</text>
    <text x="-18" y="-22" font-family="monospace" font-size="9" fill="#7c4dff" opacity="0.5">0</text>
    <text x="13" y="32" font-family="monospace" font-size="9" fill="#7c4dff" opacity="0.5">0</text>
  </g>
</g>

<!-- ═══ CARD 7 — "0" ═══ -->
<g>
  <animateMotion dur="10s" repeatCount="indefinite" begin="-7.5s"
    path="M420,125 m-230,0 a230,78 0 1,0 460,0 a230,78 0 1,0 -460,0"/>
  <g filter="url(#cg)">
    <animateTransform attributeName="transform" type="scale"
      values="0.55,0.55; 0.85,0.85; 1.3,1.3; 0.85,0.85; 0.55,0.55"
      keyTimes="0;0.25;0.5;0.75;1" dur="10s" begin="-7.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.6;1;0.6;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="10s" begin="-7.5s" repeatCount="indefinite"/>
    <rect x="-25" y="-36" width="50" height="72" rx="6" fill="url(#cf)" stroke="url(#r1)" stroke-width="1.8"/>
    <rect x="-23" y="-34" width="46" height="68" rx="4" fill="url(#bp)"/>
    <text x="0" y="8" font-family="'Courier New',monospace" font-size="36" fill="#e040fb" text-anchor="middle" font-weight="bold">0</text>
    <text x="-18" y="-22" font-family="monospace" font-size="9" fill="#e040fb" opacity="0.5">0</text>
    <text x="13" y="32" font-family="monospace" font-size="9" fill="#e040fb" opacity="0.5">0</text>
  </g>
</g>

<!-- ═══ CARD 8 — "6" ═══ -->
<g>
  <animateMotion dur="10s" repeatCount="indefinite" begin="-8.75s"
    path="M420,125 m-230,0 a230,78 0 1,0 460,0 a230,78 0 1,0 -460,0"/>
  <g filter="url(#cg)">
    <animateTransform attributeName="transform" type="scale"
      values="0.55,0.55; 0.85,0.85; 1.3,1.3; 0.85,0.85; 0.55,0.55"
      keyTimes="0;0.25;0.5;0.75;1" dur="10s" begin="-8.75s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.6;1;0.6;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="10s" begin="-8.75s" repeatCount="indefinite"/>
    <rect x="-25" y="-36" width="50" height="72" rx="6" fill="url(#cf)" stroke="url(#r2)" stroke-width="1.8"/>
    <rect x="-23" y="-34" width="46" height="68" rx="4" fill="url(#bp)"/>
    <text x="0" y="8" font-family="'Courier New',monospace" font-size="36" fill="#00e5ff" text-anchor="middle" font-weight="bold">6</text>
    <text x="-18" y="-22" font-family="monospace" font-size="9" fill="#00e5ff" opacity="0.5">6</text>
    <text x="13" y="32" font-family="monospace" font-size="9" fill="#00e5ff" opacity="0.5">6</text>
  </g>
</g>

<!-- Central glow ring -->
<circle cx="420" cy="125" r="32" fill="none" stroke="#e040fb" stroke-width="1.2" opacity="0.12">
  <animate attributeName="r" values="28;36;28" dur="3s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.12;0.04;0.12" dur="3s" repeatCount="indefinite"/>
</circle>

<!-- Center text -->
<text x="420" y="120" font-family="'Courier New',monospace" font-size="16" font-weight="bold"
      fill="#e040fb" text-anchor="middle" filter="url(#tg)" opacity="0.15">DVT3004</text>
<text x="420" y="120" font-family="'Courier New',monospace" font-size="16" font-weight="bold"
      fill="#e040fb" text-anchor="middle">DVT3004
  <animate attributeName="opacity" values="0.9;0.4;0.9" dur="3s" repeatCount="indefinite"/>
</text>
<text x="420" y="140" font-family="monospace" font-size="11" fill="#7c4dff" text-anchor="middle" opacity="0.6">est. 2006</text>

<!-- Bottom label -->
<text x="420" y="248" font-family="monospace" font-size="10" fill="#7c4dff" text-anchor="middle" opacity="0.4">3 0 0 4 &#183; 2 0 0 6</text>

<!-- Ambient particles -->
<circle cx="75" cy="45" r="1.5" fill="#e040fb" opacity="0.35"><animate attributeName="opacity" values="0.35;0.05;0.35" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="765" cy="215" r="1.5" fill="#7c4dff" opacity="0.4"><animate attributeName="opacity" values="0.4;0.08;0.4" dur="2.5s" repeatCount="indefinite"/></circle>
<circle cx="160" cy="225" r="1" fill="#00e5ff" opacity="0.3"><animate attributeName="opacity" values="0.3;0.05;0.3" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="690" cy="30" r="1" fill="#e040fb" opacity="0.3"><animate attributeName="opacity" values="0.3;0.05;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
<circle cx="45" cy="150" r="1" fill="#ff3366" opacity="0.25"><animate attributeName="opacity" values="0.25;0.03;0.25" dur="2.8s" repeatCount="indefinite"/></circle>
<circle cx="795" cy="110" r="1" fill="#00e5ff" opacity="0.2"><animate attributeName="opacity" values="0.2;0.03;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
</svg>
