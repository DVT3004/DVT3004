<svg viewBox="0 0 840 260" width="840" height="260" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="cbg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#060011"/><stop offset="100%" stop-color="#0D1117"/>
  </linearGradient>
  <linearGradient id="cf" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0825"/>
  </linearGradient>
  <linearGradient id="r1" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#e040fb"/><stop offset="100%" stop-color="#7c4dff"/>
  </linearGradient>
  <linearGradient id="r2" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#7c4dff"/><stop offset="100%" stop-color="#00e5ff"/>
  </linearGradient>
  <!-- Card back gradient -->
  <linearGradient id="cardback" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#2a0845"/><stop offset="50%" stop-color="#1a0530"/><stop offset="100%" stop-color="#2a0845"/>
  </linearGradient>
  <filter id="cg"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="tg"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

  <!-- Pattern for card back -->
  <pattern id="backpat" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
    <rect width="10" height="10" fill="none"/>
    <path d="M0,5 L5,0 L10,5 L5,10 Z" fill="#7c4dff" opacity="0.15"/>
  </pattern>
</defs>

<!-- Background -->
<rect width="840" height="260" fill="url(#cbg)" rx="10"/>

<!-- Orbit rings -->
<ellipse cx="420" cy="130" rx="220" ry="75" fill="none" stroke="#7c4dff" stroke-width="0.6" opacity="0.12"/>
<ellipse cx="420" cy="130" rx="220" ry="75" fill="none" stroke="#e040fb" stroke-width="0.4" opacity="0.06" stroke-dasharray="4,6"/>

<!-- Orbit sparkles -->
<circle r="2" fill="#e040fb" opacity="0.6">
  <animateMotion dur="12s" repeatCount="indefinite" path="M420,130 m-220,0 a220,75 0 1,0 440,0 a220,75 0 1,0 -440,0"/>
  <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.5s" repeatCount="indefinite"/>
</circle>
<circle r="1.5" fill="#7c4dff" opacity="0.5">
  <animateMotion dur="12s" repeatCount="indefinite" begin="-6s" path="M420,130 m-220,0 a220,75 0 1,0 440,0 a220,75 0 1,0 -440,0"/>
  <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2s" repeatCount="indefinite"/>
</circle>

<!--
  3D EFFECT: Each card has synchronized animations:
  1. animateMotion → elliptical orbit path
  2. animateTransform scale → big at front (bottom), small at back (top) + scaleX flips to simulate turning
  3. animate opacity → bright at front, dim at back

  Scale X flips: front=1, sides=0 (edge-on), back=-1 but we use scaleX 1→0→-0.6→0→1
  Scale Y: front=1.15 (closer=bigger), back=0.65 (further=smaller)
  Opacity: front=1, back=0.3

  12s cycle, 7 cards, stagger = 12/7 ≈ 1.714s
-->

<!-- ═══ CARD 1 — A♠ ═══ -->
<g filter="url(#cg)">
  <animateMotion dur="12s" repeatCount="indefinite" begin="0s"
    path="M420,130 m-220,0 a220,75 0 1,0 440,0 a220,75 0 1,0 -440,0"/>
  <g>
    <!-- 3D scale: scaleX flips, scaleY = depth size -->
    <animateTransform attributeName="transform" type="scale"
      values="0.65,0.65; 1,0.85; 1.15,1.15; 1,0.85; 0.65,0.65"
      keyTimes="0;0.25;0.5;0.75;1" dur="12s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;1;0.7;0.3" keyTimes="0;0.25;0.5;0.75;1" dur="12s" begin="0s" repeatCount="indefinite"/>
    <!-- Card face -->
    <rect x="-25" y="-36" width="50" height="72" rx="6" fill="url(#cf)" stroke="url(#r1)" stroke-width="1.5"/>
    <!-- Back pattern overlay (visible when "flipped") -->
    <rect x="-23" y="-34" width="46" height="68" rx="4" fill="url(#backpat)" opacity="0.3"/>
    <text x="0" y="-8" font-family="'Courier New',monospace" font-size="18" fill="#e040fb" text-anchor="middle" font-weight="bold">A</text>
    <text x="0" y="16" font-family="serif" font-size="22" fill="#e040fb" text-anchor="middle">&#9824;</text>
    <!-- Corner labels -->
    <text x="-18" y="-22" font-family="monospace" font-size="8" fill="#e040fb" opacity="0.6">A</text>
    <text x="12" y="30" font-family="monospace" font-size="8" fill="#e040fb" opacity="0.6">A</text>
  </g>
</g>

<!-- ═══ CARD 2 — K♥ ═══ -->
<g filter="url(#cg)">
  <animateMotion dur="12s" repeatCount="indefinite" begin="-1.714s"
    path="M420,130 m-220,0 a220,75 0 1,0 440,0 a220,75 0 1,0 -440,0"/>
  <g>
    <animateTransform attributeName="transform" type="scale"
      values="0.65,0.65; 1,0.85; 1.15,1.15; 1,0.85; 0.65,0.65"
      keyTimes="0;0.25;0.5;0.75;1" dur="12s" begin="-1.714s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;1;0.7;0.3" keyTimes="0;0.25;0.5;0.75;1" dur="12s" begin="-1.714s" repeatCount="indefinite"/>
    <rect x="-25" y="-36" width="50" height="72" rx="6" fill="url(#cf)" stroke="url(#r2)" stroke-width="1.5"/>
    <rect x="-23" y="-34" width="46" height="68" rx="4" fill="url(#backpat)" opacity="0.3"/>
    <text x="0" y="-8" font-family="'Courier New',monospace" font-size="18" fill="#ff3366" text-anchor="middle" font-weight="bold">K</text>
    <text x="0" y="16" font-family="serif" font-size="22" fill="#ff3366" text-anchor="middle">&#9829;</text>
    <text x="-18" y="-22" font-family="monospace" font-size="8" fill="#ff3366" opacity="0.6">K</text>
    <text x="12" y="30" font-family="monospace" font-size="8" fill="#ff3366" opacity="0.6">K</text>
  </g>
</g>

<!-- ═══ CARD 3 — 7♦ ═══ -->
<g filter="url(#cg)">
  <animateMotion dur="12s" repeatCount="indefinite" begin="-3.428s"
    path="M420,130 m-220,0 a220,75 0 1,0 440,0 a220,75 0 1,0 -440,0"/>
  <g>
    <animateTransform attributeName="transform" type="scale"
      values="0.65,0.65; 1,0.85; 1.15,1.15; 1,0.85; 0.65,0.65"
      keyTimes="0;0.25;0.5;0.75;1" dur="12s" begin="-3.428s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;1;0.7;0.3" keyTimes="0;0.25;0.5;0.75;1" dur="12s" begin="-3.428s" repeatCount="indefinite"/>
    <rect x="-25" y="-36" width="50" height="72" rx="6" fill="url(#cf)" stroke="url(#r1)" stroke-width="1.5"/>
    <rect x="-23" y="-34" width="46" height="68" rx="4" fill="url(#backpat)" opacity="0.3"/>
    <text x="0" y="-8" font-family="'Courier New',monospace" font-size="18" fill="#ff8c00" text-anchor="middle" font-weight="bold">7</text>
    <text x="0" y="16" font-family="serif" font-size="22" fill="#ff8c00" text-anchor="middle">&#9830;</text>
    <text x="-18" y="-22" font-family="monospace" font-size="8" fill="#ff8c00" opacity="0.6">7</text>
    <text x="12" y="30" font-family="monospace" font-size="8" fill="#ff8c00" opacity="0.6">7</text>
  </g>
</g>

<!-- ═══ CARD 4 — J♣ ═══ -->
<g filter="url(#cg)">
  <animateMotion dur="12s" repeatCount="indefinite" begin="-5.142s"
    path="M420,130 m-220,0 a220,75 0 1,0 440,0 a220,75 0 1,0 -440,0"/>
  <g>
    <animateTransform attributeName="transform" type="scale"
      values="0.65,0.65; 1,0.85; 1.15,1.15; 1,0.85; 0.65,0.65"
      keyTimes="0;0.25;0.5;0.75;1" dur="12s" begin="-5.142s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;1;0.7;0.3" keyTimes="0;0.25;0.5;0.75;1" dur="12s" begin="-5.142s" repeatCount="indefinite"/>
    <rect x="-25" y="-36" width="50" height="72" rx="6" fill="url(#cf)" stroke="url(#r2)" stroke-width="1.5"/>
    <rect x="-23" y="-34" width="46" height="68" rx="4" fill="url(#backpat)" opacity="0.3"/>
    <text x="0" y="-8" font-family="'Courier New',monospace" font-size="18" fill="#00e5ff" text-anchor="middle" font-weight="bold">J</text>
    <text x="0" y="16" font-family="serif" font-size="22" fill="#00e5ff" text-anchor="middle">&#9827;</text>
    <text x="-18" y="-22" font-family="monospace" font-size="8" fill="#00e5ff" opacity="0.6">J</text>
    <text x="12" y="30" font-family="monospace" font-size="8" fill="#00e5ff" opacity="0.6">J</text>
  </g>
</g>

<!-- ═══ CARD 5 — 3♠ ═══ -->
<g filter="url(#cg)">
  <animateMotion dur="12s" repeatCount="indefinite" begin="-6.857s"
    path="M420,130 m-220,0 a220,75 0 1,0 440,0 a220,75 0 1,0 -440,0"/>
  <g>
    <animateTransform attributeName="transform" type="scale"
      values="0.65,0.65; 1,0.85; 1.15,1.15; 1,0.85; 0.65,0.65"
      keyTimes="0;0.25;0.5;0.75;1" dur="12s" begin="-6.857s" repeatCount="indefinite"/>
