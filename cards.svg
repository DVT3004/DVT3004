    <rect x="-25" y="-36" width="50" height="72" rx="6" fill="url(#cf)" stroke="url(#r1)" stroke-width="1.5"/>
    <rect x="-23" y="-34" width="46" height="68" rx="4" fill="url(#backpat)" opacity="0.3"/>
    <text x="0" y="-8" font-family="'Courier New',monospace" font-size="18" fill="#e040fb" text-anchor="middle" font-weight="bold">3</text>
    <text x="0" y="16" font-family="serif" font-size="22" fill="#e040fb" text-anchor="middle">&#9824;</text>
    <text x="-18" y="-22" font-family="monospace" font-size="8" fill="#e040fb" opacity="0.6">3</text>
    <text x="12" y="30" font-family="monospace" font-size="8" fill="#e040fb" opacity="0.6">3</text>
  </g>
</g>

