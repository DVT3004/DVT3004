    <text x="0" y="8" font-family="'Courier New',monospace" font-size="36" fill="#ff3366" text-anchor="middle" font-weight="bold">2</text>
    <text x="-18" y="-22" font-family="monospace" font-size="9" fill="#ff3366" opacity="0.5">2</text>
    <text x="13" y="32" font-family="monospace" font-size="9" fill="#ff3366" opacity="0.5">2</text>
  </g>
</g>

