<svg viewBox="0 0 840 260" width="840" height="260" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="cbg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#060011"/><stop offset="100%" stop-color="#0D1117"/>
  </linearGradient>
  <linearGradient id="cf" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0d0825"/>
  </linearGradient>
  <!-- Bright front face -->
  <linearGradient id="cfBright" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#2d1868"/><stop offset="100%" stop-color="#1a0d45"/>
  </linearGradient>
  <linearGradient id="r1" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#e040fb"/><stop offset="100%" stop-color="#7c4dff"/>
  </linearGradient>
  <linearGradient id="r2" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#7c4dff"/><stop offset="100%" stop-color="#00e5ff"/>
  </linearGradient>
  <pattern id="bp" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
    <path d="M0,5 L5,0 L10,5 L5,10 Z" fill="#7c4dff" opacity="0.12"/>
  </pattern>
  <filter id="cg"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <!-- Extra strong glow for front card -->
  <filter id="frontGlow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="tg"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="840" height="260" fill="url(#cbg)" rx="10"/>

<!-- Orbit rings -->
<ellipse cx="420" cy="125" rx="230" ry="78" fill="none" stroke="#7c4dff" stroke-width="0.6" opacity="0.12"/>
<ellipse cx="420" cy="125" rx="230" ry="78" fill="none" stroke="#e040fb" stroke-width="0.4" opacity="0.06" stroke-dasharray="4,6"/>

<!-- Orbit sparkles -->
<circle r="2.5" fill="#e040fb" opacity="0.7">
  <animateMotion dur="10s" repeatCount="indefinite" path="M420,125 m-230,0 a230,78 0 1,0 460,0 a230,78 0 1,0 -460,0"/>
  <animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.2s" repeatCount="indefinite"/>
</circle>
<circle r="2" fill="#7c4dff" opacity="0.5">
  <animateMotion dur="10s" repeatCount="indefinite" begin="-5s" path="M420,125 m-230,0 a230,78 0 1,0 460,0 a230,78 0 1,0 -460,0"/>
  <animate attributeName="opacity" values="0.5;0.1;0.5" dur="1.8s" repeatCount="indefinite"/>
</circle>
<circle r="1.5" fill="#00e5ff" opacity="0.4">
  <animateMotion dur="10s" repeatCount="indefinite" begin="-2.5s" path="M420,125 m-230,0 a230,78 0 1,0 460,0 a230,78 0 1,0 -460,0"/>
  <animate attributeName="opacity" values="0.4;0.05;0.4" dur="2.2s" repeatCount="indefinite"/>
</circle>

<!--
  8 CARDS: digits 3 0 0 4 2 0 0 6
  10s cycle, stagger = 10/8 = 1.25s

  3D effect:
    Scale: back=0.55 → side=0.85 → FRONT=1.3 → side=0.85 → back=0.55
    Opacity: back=0.2 → side=0.6 → FRONT=1.0 → side=0.6 → back=0.2
    Filter: front gets frontGlow (extra bright), others get cg

  Since we can't dynamically switch filters, we use double-layered glow:
  - Base layer always visible with cg filter
  - Bright overlay that pulses opacity in sync (bright only at front position)
-->

<!-- ═══ CARD 1 — "3" ═══ -->
<g>
  <animateMotion dur="10s" repeatCount="indefinite" begin="0s"
    path="M420,125 m-230,0 a230,78 0 1,0 460,0 a230,78 0 1,0 -460,0"/>
  <g filter="url(#cg)">
    <animateTransform attributeName="transform" type="scale"
      values="0.55,0.55; 0.85,0.85; 1.3,1.3; 0.85,0.85; 0.55,0.55"
      keyTimes="0;0.25;0.5;0.75;1" dur="10s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.6;1;0.6;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="10s" begin="0s" repeatCount="indefinite"/>
    <rect x="-25" y="-36" width="50" height="72" rx="6" fill="url(#cf)" stroke="url(#r1)" stroke-width="1.8"/>
    <rect x="-23" y="-34" width="46" height="68" rx="4" fill="url(#bp)"/>
    <text x="0" y="8" font-family="'Courier New',monospace" font-size="36" fill="#e040fb" text-anchor="middle" font-weight="bold">3</text>
    <text x="-18" y="-22" font-family="monospace" font-size="9" fill="#e040fb" opacity="0.5">3</text>
    <text x="13" y="32" font-family="monospace" font-size="9" fill="#e040fb" opacity="0.5">3</text>
  </g>
</g>

<!-- ═══ CARD 2 — "0" ═══ -->
<g>
  <animateMotion dur="10s" repeatCount="indefinite" begin="-1.25s"
    path="M420,125 m-230,0 a230,78 0 1,0 460,0 a230,78 0 1,0 -460,0"/>
  <g filter="url(#cg)">
    <animateTransform attributeName="transform" type="scale"
      values="0.55,0.55; 0.85,0.85; 1.3,1.3; 0.85,0.85; 0.55,0.55"
      keyTimes="0;0.25;0.5;0.75;1" dur="10s" begin="-1.25s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.6;1;0.6;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="10s" begin="-1.25s" repeatCount="indefinite"/>
    <rect x="-25" y="-36" width="50" height="72" rx="6" fill="url(#cf)" stroke="url(#r2)" stroke-width="1.8"/>
    <rect x="-23" y="-34" width="46" height="68" rx="4" fill="url(#bp)"/>
    <text x="0" y="8" font-family="'Courier New',monospace" font-size="36" fill="#7c4dff" text-anchor="middle" font-weight="bold">0</text>
    <text x="-18" y="-22" font-family="monospace" font-size="9" fill="#7c4dff" opacity="0.5">0</text>
    <text x="13" y="32" font-family="monospace" font-size="9" fill="#7c4dff" opacity="0.5">0</text>
  </g>
</g>

<!-- ═══ CARD 3 — "0" ═══ -->
<g>
  <animateMotion dur="10s" repeatCount="indefinite" begin="-2.5s"
