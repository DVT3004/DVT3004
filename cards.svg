    <animate attributeName="opacity" values="0.2;0.6;1;0.6;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="10s" begin="-3.75s" repeatCount="indefinite"/>
    <rect x="-25" y="-36" width="50" height="72" rx="6" fill="url(#cf)" stroke="url(#r2)" stroke-width="1.8"/>
    <rect x="-23" y="-34" width="46" height="68" rx="4" fill="url(#bp)"/>
    <text x="0" y="8" font-family="'Courier New',monospace" font-size="36" fill="#00e5ff" text-anchor="middle" font-weight="bold">4</text>
    <text x="-18" y="-22" font-family="monospace" font-size="9" fill="#00e5ff" opacity="0.5">4</text>
    <text x="13" y="32" font-family="monospace" font-size="9" fill="#00e5ff" opacity="0.5">4</text>
  </g>
</g>

<!-- ═══ CARD 5 — "2" ═══ -->
<g>
  <animateMotion dur="10s" repeatCount="indefinite" begin="-5s"
    path="M420,125 m-230,0 a230,78 0 1,0 460,0 a230,78 0 1,0 -460,0"/>
  <g filter="url(#cg)">
    <animateTransform attributeName="transform" type="scale"
      values="0.55,0.55; 0.85,0.85; 1.3,1.3; 0.85,0.85; 0.55,0.55"
      keyTimes="0;0.25;0.5;0.75;1" dur="10s" begin="-5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.6;1;0.6;0.2" keyTimes="0;0.25;0.5;0.75;1" dur="10s" begin="-5s" repeatCount="indefinite"/>
    <rect x="-25" y="-36" width="50" height="72" rx="6" fill="url(#cf)" stroke="url(#r1)" stroke-width="1.8"/>
