<g filter="url(#cg)">
  <animateMotion dur="12s" repeatCount="indefinite" begin="-8.571s"
    path="M420,130 m-220,0 a220,75 0 1,0 440,0 a220,75 0 1,0 -440,0"/>
  <g>
    <animateTransform attributeName="transform" type="scale"
      values="0.65,0.65; 1,0.85; 1.15,1.15; 1,0.85; 0.65,0.65"
      keyTimes="0;0.25;0.5;0.75;1" dur="12s" begin="-8.571s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;1;0.7;0.3" keyTimes="0;0.25;0.5;0.75;1" dur="12s" begin="-8.571s" repeatCount="indefinite"/>
    <rect x="-25" y="-36" width="50" height="72" rx="6" fill="url(#cf)" stroke="url(#r2)" stroke-width="1.5"/>
    <rect x="-23" y="-34" width="46" height="68" rx="4" fill="url(#backpat)" opacity="0.3"/>
    <text x="0" y="-8" font-family="'Courier New',monospace" font-size="18" fill="#ff3366" text-anchor="middle" font-weight="bold">Q</text>
    <text x="0" y="16" font-family="serif" font-size="22" fill="#ff3366" text-anchor="middle">&#9829;</text>
