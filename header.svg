<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060011"/>
      <stop offset="50%" style="stop-color:#0a0020"/>
      <stop offset="100%" style="stop-color:#0D1117"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e040fb"/>
      <stop offset="40%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#7c4dff"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c4dff;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#e040fb;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#e040fb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7c4dff;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c4dff"/>
      <stop offset="100%" style="stop-color:#e040fb"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="greenGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="progressClip">
      <rect x="280" y="163" width="340" height="8" rx="4"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)" rx="14"/>

  <!-- Circuit board lines (subtle) -->
  <g stroke="#7c4dff" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="30" x2="120" y2="30"/><line x1="120" y1="30" x2="120" y2="80"/>
    <line x1="760" y1="30" x2="900" y2="30"/><line x1="780" y1="30" x2="780" y2="90"/>
    <line x1="0" y1="170" x2="80" y2="170"/><line x1="80" y1="170" x2="80" y2="130"/>
    <line x1="820" y1="170" x2="900" y2="170"/><line x1="820" y1="170" x2="820" y2="120"/>
    <line x1="180" y1="0" x2="180" y2="40"/><line x1="720" y1="0" x2="720" y2="40"/>
    <circle cx="120" cy="80" r="3" fill="#7c4dff"/>
    <circle cx="780" cy="90" r="3" fill="#7c4dff"/>
    <circle cx="80" cy="130" r="3" fill="#e040fb"/>
    <circle cx="820" cy="120" r="3" fill="#e040fb"/>
  </g>

  <!-- Grid dots -->
  <g fill="#7c4dff" opacity="0.1">
    <circle cx="45" cy="25" r="1.5"/><circle cx="135" cy="25" r="1.5"/><circle cx="225" cy="25" r="1.5"/>
    <circle cx="315" cy="25" r="1.5"/><circle cx="405" cy="25" r="1.5"/><circle cx="495" cy="25" r="1.5"/>
    <circle cx="585" cy="25" r="1.5"/><circle cx="675" cy="25" r="1.5"/><circle cx="765" cy="25" r="1.5"/>
    <circle cx="855" cy="25" r="1.5"/>
    <circle cx="45" cy="175" r="1.5"/><circle cx="135" cy="175" r="1.5"/><circle cx="225" cy="175" r="1.5"/>
    <circle cx="315" cy="175" r="1.5"/><circle cx="405" cy="175" r="1.5"/><circle cx="495" cy="175" r="1.5"/>
    <circle cx="585" cy="175" r="1.5"/><circle cx="675" cy="175" r="1.5"/><circle cx="765" cy="175" r="1.5"/>
    <circle cx="855" cy="175" r="1.5"/>
  </g>

  <!-- Center glow orb -->
  <ellipse cx="450" cy="90" rx="260" ry="100" fill="#7c4dff" opacity="0.06"/>

  <!-- Animated scan line -->
  <rect x="0" y="0" width="900" height="1.5" fill="url(#lineGrad)" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" from="0,0" to="0,198" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner L-brackets -->
  <path d="M14,10 L14,38 M10,14 L38,14" stroke="#e040fb" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <path d="M886,10 L886,38 M890,14 L862,14" stroke="#e040fb" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <path d="M14,190 L14,162 M10,186 L38,186" stroke="#e040fb" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <path d="M886,190 L886,162 M890,186 L862,186" stroke="#e040fb" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

  <!-- Left accent bars -->
  <rect x="55" y="60" width="3" height="70" rx="2" fill="#e040fb" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="62" y="75" width="2" height="40" rx="1" fill="#7c4dff" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.08;0.35" dur="2s" repeatCount="indefinite" begin="0.3s"/>
  </rect>
  <!-- Right accent bars -->
  <rect x="842" y="60" width="3" height="70" rx="2" fill="#e040fb" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </rect>
  <rect x="836" y="75" width="2" height="40" rx="1" fill="#7c4dff" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.08;0.35" dur="2s" repeatCount="indefinite" begin="0.8s"/>
  </rect>

  <!-- GLOW behind name -->
  <text x="445" y="90" font-family="'Courier New', Courier, monospace" font-size="56" font-weight="bold"
        text-anchor="middle" fill="#e040fb" filter="url(#bigGlow)" opacity="0.3">DVT3004</text>

  <!-- Main name with subtle pulse -->
  <text x="445" y="90" font-family="'Courier New', Courier, monospace" font-size="56" font-weight="bold"
        text-anchor="middle" fill="url(#nameGrad)" filter="url(#neon)" letter-spacing="5">
    DVT3004
    <animate attributeName="opacity" values="1;0.88;1" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Typing cursor blinking -->
  <rect x="693" y="55" width="4" height="42" rx="1" fill="#e040fb">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Horizontal line separator -->
  <line x1="120" y1="110" x2="780" y2="110" stroke="url(#lineGrad)" stroke-width="1"/>

  <!-- Subtitle -->
  <text x="450" y="135" font-family="'Courier New', Courier, monospace" font-size="14"
        text-anchor="middle" fill="#c792ea" letter-spacing="5" opacity="0.9">
    ⚡  JAVA · JAVASCRIPT · DEVELOPER  🇻🇳
  </text>

  <!-- Online badge — green dot + text -->
  <circle cx="296" cy="148" r="5" fill="#00e676" filter="url(#greenGlow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;6;5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="307" y="152" font-family="'Courier New', Courier, monospace" font-size="11"
        fill="#00e676" letter-spacing="2" opacity="0.9">ONLINE · CODING NOW</text>

  <!-- Clock / time indicator -->
  <text x="595" y="152" font-family="'Courier New', Courier, monospace" font-size="11"
        fill="#7c4dff" letter-spacing="1" opacity="0.7">VN · GMT+7</text>

  <!-- Progress bar track -->
  <rect x="280" y="163" width="340" height="8" rx="4" fill="#1a1a3a"/>
  <!-- Progress bar fill animated -->
  <rect x="280" y="163" width="0" height="8" rx="4" fill="url(#progressGrad)">
    <animate attributeName="width" values="0;210;340;340" keyTimes="0;0.5;0.8;1" dur="3s" fill="freeze" repeatCount="1"/>
  </rect>
  <!-- Progress shimmer -->
  <rect x="270" y="162" width="30" height="10" rx="5" fill="white" opacity="0.3">
    <animateTransform attributeName="transform" type="translate" from="-30,0" to="380,0" dur="2.5s" begin="1s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="177" font-family="'Courier New', Courier, monospace" font-size="9"
        text-anchor="middle" fill="#7c4dff" letter-spacing="3" opacity="0.7">LOADING AWESOME...</text>

  <!-- Floating particles -->
  <circle cx="110" cy="55" r="2.5" fill="#e040fb" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="55;48;55" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="790" cy="60" r="2.5" fill="#7c4dff" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.1;0.7" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="60;53;60" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="155" r="2" fill="#e040fb" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="155;148;155" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="150" r="2" fill="#7c4dff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;143;150" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="30" r="1.5" fill="#e040fb" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="90" r="1.5" fill="#00e676" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="740" cy="95" r="1.5" fill="#00b0ff" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.8;0.35" dur="2.8s" repeatCount="indefinite" begin="0.5s"/>
  </circle>

  <!-- Border animated -->
  <rect x="1" y="1" width="898" height="198" rx="14" fill="none" stroke="#7c4dff" stroke-width="1.5" stroke-opacity="0.5">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#7c4dff;#e040fb;#7c4dff" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
