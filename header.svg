<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0015"/>
      <stop offset="100%" style="stop-color:#0D1117"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e040fb"/>
      <stop offset="40%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#7c4dff"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c4dff;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#e040fb;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#e040fb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7c4dff;stop-opacity:0"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BG -->
  <rect width="900" height="160" fill="url(#bg)" rx="12"/>

  <!-- Grid dots -->
  <g fill="#7c4dff" opacity="0.12">
    <circle cx="45" cy="20" r="1.5"/><circle cx="135" cy="20" r="1.5"/><circle cx="225" cy="20" r="1.5"/>
    <circle cx="315" cy="20" r="1.5"/><circle cx="405" cy="20" r="1.5"/><circle cx="495" cy="20" r="1.5"/>
    <circle cx="585" cy="20" r="1.5"/><circle cx="675" cy="20" r="1.5"/><circle cx="765" cy="20" r="1.5"/>
    <circle cx="855" cy="20" r="1.5"/>
    <circle cx="45" cy="60" r="1.5"/><circle cx="135" cy="60" r="1.5"/><circle cx="225" cy="60" r="1.5"/>
    <circle cx="315" cy="60" r="1.5"/><circle cx="405" cy="60" r="1.5"/><circle cx="495" cy="60" r="1.5"/>
    <circle cx="585" cy="60" r="1.5"/><circle cx="675" cy="60" r="1.5"/><circle cx="765" cy="60" r="1.5"/>
    <circle cx="855" cy="60" r="1.5"/>
    <circle cx="45" cy="100" r="1.5"/><circle cx="135" cy="100" r="1.5"/><circle cx="225" cy="100" r="1.5"/>
    <circle cx="315" cy="100" r="1.5"/><circle cx="405" cy="100" r="1.5"/><circle cx="495" cy="100" r="1.5"/>
    <circle cx="585" cy="100" r="1.5"/><circle cx="675" cy="100" r="1.5"/><circle cx="765" cy="100" r="1.5"/>
    <circle cx="855" cy="100" r="1.5"/>
    <circle cx="45" cy="140" r="1.5"/><circle cx="135" cy="140" r="1.5"/><circle cx="225" cy="140" r="1.5"/>
    <circle cx="315" cy="140" r="1.5"/><circle cx="405" cy="140" r="1.5"/><circle cx="495" cy="140" r="1.5"/>
    <circle cx="585" cy="140" r="1.5"/><circle cx="675" cy="140" r="1.5"/><circle cx="765" cy="140" r="1.5"/>
    <circle cx="855" cy="140" r="1.5"/>
  </g>

  <!-- Center glow orb -->
  <ellipse cx="450" cy="80" rx="220" ry="90" fill="#7c4dff" opacity="0.08"/>

  <!-- Animated scan line -->
  <rect x="0" y="0" width="900" height="1.5" fill="url(#lineGrad)" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" from="0,0" to="0,158" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner L-brackets -->
  <path d="M12,8 L12,32 M8,12 L32,12" stroke="#e040fb" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <path d="M888,8 L888,32 M892,12 L868,12" stroke="#e040fb" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <path d="M12,152 L12,128 M8,148 L32,148" stroke="#e040fb" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <path d="M888,152 L888,128 M892,148 L868,148" stroke="#e040fb" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

  <!-- Left accent bar -->
  <rect x="55" y="50" width="3" height="60" rx="2" fill="#e040fb" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="62" y="62" width="2" height="36" rx="1" fill="#7c4dff" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite" begin="0.3s"/>
  </rect>

  <!-- Right accent bar -->
  <rect x="842" y="50" width="3" height="60" rx="2" fill="#e040fb" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </rect>
  <rect x="836" y="62" width="2" height="36" rx="1" fill="#7c4dff" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite" begin="0.8s"/>
  </rect>

  <!-- GLOW behind name -->
  <text x="450" y="78" font-family="'Courier New', Courier, monospace" font-size="58" font-weight="bold"
        text-anchor="middle" fill="#e040fb" filter="url(#bigGlow)" opacity="0.35">DVT3004</text>

  <!-- Main name -->
  <text x="450" y="78" font-family="'Courier New', Courier, monospace" font-size="58" font-weight="bold"
        text-anchor="middle" fill="url(#nameGrad)" filter="url(#neon)" letter-spacing="4">
    DVT3004
    <animate attributeName="opacity" values="1;0.9;1" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Horizontal line separator -->
  <line x1="150" y1="95" x2="750" y2="95" stroke="url(#lineGrad)" stroke-width="1"/>

  <!-- Subtitle -->
  <text x="450" y="120" font-family="'Courier New', Courier, monospace" font-size="15"
        text-anchor="middle" fill="#c792ea" letter-spacing="6" opacity="0.9">
    ⚡  JAVA · JAVASCRIPT · DEVELOPER  🇻🇳
  </text>

  <!-- Floating particles -->
  <circle cx="110" cy="45" r="2" fill="#e040fb" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="45;40;45" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="790" cy="50" r="2" fill="#7c4dff" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.1;0.7" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="50;44;50" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="130" r="1.5" fill="#e040fb" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="125" r="1.5" fill="#7c4dff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Border -->
  <rect x="1" y="1" width="898" height="158" rx="12" fill="none" stroke="#7c4dff" stroke-width="1" stroke-opacity="0.5">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
