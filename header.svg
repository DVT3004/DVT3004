<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="50%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0D1117"/>
    </linearGradient>

    <!-- Purple glow gradient -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#9B30FF;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#0D1117;stop-opacity:0"/>
    </radialGradient>

    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C77DFF"/>
      <stop offset="50%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#9B30FF"/>
    </linearGradient>

    <!-- Filter glow -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#bg)" rx="14"/>

  <!-- Glow orb center -->
  <ellipse cx="450" cy="140" rx="300" ry="160" fill="url(#glow)"/>

  <!-- Grid lines - horizontal -->
  <g stroke="#9B30FF" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
  </g>

  <!-- Grid lines - vertical -->
  <g stroke="#9B30FF" stroke-opacity="0.08" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="280"/>
    <line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="400" y1="0" x2="400" y2="280"/>
    <line x1="500" y1="0" x2="500" y2="280"/>
    <line x1="600" y1="0" x2="600" y2="280"/>
    <line x1="700" y1="0" x2="700" y2="280"/>
    <line x1="800" y1="0" x2="800" y2="280"/>
  </g>

  <!-- Floating particles -->
  <circle cx="80" cy="60" r="2" fill="#C77DFF" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="80" r="2" fill="#C77DFF" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="220" r="3" fill="#9B30FF" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="200" r="2" fill="#C77DFF" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="30" r="2" fill="#ffffff" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="250" r="2" fill="#ffffff" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="50" r="1.5" fill="#C77DFF" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="40" r="1.5" fill="#C77DFF" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Corner decorations -->
  <rect x="10" y="10" width="30" height="3" fill="#9B30FF" opacity="0.8" rx="2"/>
  <rect x="10" y="10" width="3" height="30" fill="#9B30FF" opacity="0.8" rx="2"/>

  <rect x="860" y="10" width="30" height="3" fill="#9B30FF" opacity="0.8" rx="2"/>
  <rect x="887" y="10" width="3" height="30" fill="#9B30FF" opacity="0.8" rx="2"/>

  <rect x="10" y="267" width="30" height="3" fill="#9B30FF" opacity="0.8" rx="2"/>
  <rect x="10" y="240" width="3" height="30" fill="#9B30FF" opacity="0.8" rx="2"/>

  <rect x="860" y="267" width="30" height="3" fill="#9B30FF" opacity="0.8" rx="2"/>
  <rect x="887" y="240" width="3" height="30" fill="#9B30FF" opacity="0.8" rx="2"/>

  <!-- Animated scanning line -->
  <rect x="0" y="0" width="900" height="2" fill="url(#textGrad)" opacity="0.5" rx="1">
    <animateTransform attributeName="transform" type="translate" from="0,0" to="0,278" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Main name - glow shadow -->
  <text x="450" y="132" font-family="'Courier New', monospace" font-size="72" font-weight="bold"
        text-anchor="middle" fill="#6A0DAD" filter="url(#softGlow)" opacity="0.6">
    DVT3004
  </text>

  <!-- Main name - text -->
  <text x="450" y="132" font-family="'Courier New', monospace" font-size="72" font-weight="bold"
        text-anchor="middle" fill="url(#textGrad)" filter="url(#glowFilter)">
    DVT3004
    <animate attributeName="opacity" values="1;0.85;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle line -->
  <line x1="200" y1="152" x2="700" y2="152" stroke="#9B30FF" stroke-opacity="0.4" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Subtitle text -->
  <text x="450" y="178" font-family="'Courier New', monospace" font-size="18"
        text-anchor="middle" fill="#C77DFF" letter-spacing="4">
    ⚡ DEVELOPER · CREATOR · VIỆT NAM 🇻🇳
  </text>

  <!-- Bottom tech tags -->
  <!-- Java pill -->
  <rect x="244" y="205" width="80" height="28" rx="14" fill="#ED8B00" opacity="0.15"/>
  <rect x="244" y="205" width="80" height="28" rx="14" fill="none" stroke="#ED8B00" stroke-width="1" stroke-opacity="0.6"/>
  <text x="284" y="224" font-family="'Courier New', monospace" font-size="13" font-weight="bold"
        fill="#ED8B00" text-anchor="middle">☕ Java</text>

  <!-- JS pill -->
  <rect x="340" y="205" width="110" height="28" rx="14" fill="#F7DF1E" opacity="0.1"/>
  <rect x="340" y="205" width="110" height="28" rx="14" fill="none" stroke="#F7DF1E" stroke-width="1" stroke-opacity="0.6"/>
  <text x="395" y="224" font-family="'Courier New', monospace" font-size="13" font-weight="bold"
        fill="#F7DF1E" text-anchor="middle">⚡ JavaScript</text>

  <!-- Git pill -->
  <rect x="466" y="205" width="80" height="28" rx="14" fill="#F05032" opacity="0.15"/>
  <rect x="466" y="205" width="80" height="28" rx="14" fill="none" stroke="#F05032" stroke-width="1" stroke-opacity="0.6"/>
  <text x="506" y="224" font-family="'Courier New', monospace" font-size="13" font-weight="bold"
        fill="#F05032" text-anchor="middle">🔥 Git</text>

  <!-- PRO badge -->
  <rect x="563" y="205" width="70" height="28" rx="14" fill="#FFD700" opacity="0.2"/>
  <rect x="563" y="205" width="70" height="28" rx="14" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-opacity="0.9"/>
  <text x="598" y="224" font-family="'Courier New', monospace" font-size="13" font-weight="bold"
        fill="#FFD700" text-anchor="middle">★ PRO</text>

  <!-- Border glow -->
  <rect x="1" y="1" width="898" height="278" rx="14" fill="none" stroke="#9B30FF" stroke-width="1.5" stroke-opacity="0.4">
    <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
