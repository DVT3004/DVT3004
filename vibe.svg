<svg viewBox="0 0 840 120" width="840" height="120" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="vg1" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#e040fb"/><stop offset="50%" stop-color="#7c4dff"/><stop offset="100%" stop-color="#00e5ff"/>
  </linearGradient>
  <linearGradient id="vg2" x1="0%" y1="100%" x2="0%" y2="0%">
    <stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#1a0d30"/>
  </linearGradient>
  <filter id="vglow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="bglow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="840" height="120" fill="#0d1117" rx="8"/>

<!-- Audio wave bars — 30 bars with staggered bounce animations -->
<g filter="url(#vglow)">
<!-- Each bar: rect at bottom (y=95), bounces height upward. Different dur/begin for wave effect. -->
<rect x="60" y="95" width="6" height="0" rx="3" fill="url(#vg1)"><animate attributeName="height" values="8;45;20;55;12;35;8" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="87;50;75;40;83;60;87" dur="1.2s" repeatCount="indefinite"/></rect>
<rect x="80" y="95" width="6" height="0" rx="3" fill="url(#vg1)"><animate attributeName="height" values="12;55;8;40;20;50;12" dur="1.4s" begin="-0.1s" repeatCount="indefinite"/><animate attributeName="y" values="83;40;87;55;75;45;83" dur="1.4s" begin="-0.1s" repeatCount="indefinite"/></rect>
<rect x="100" y="95" width="6" height="0" rx="3" fill="url(#vg1)"><animate attributeName="height" values="20;60;15;50;8;40;20" dur="1.1s" begin="-0.2s" repeatCount="indefinite"/><animate attributeName="y" values="75;35;80;45;87;55;75" dur="1.1s" begin="-0.2s" repeatCount="indefinite"/></rect>
<rect x="120" y="95" width="6" height="0" rx="3" fill="url(#vg1)"><animate attributeName="height" values="35;50;10;60;25;45;35" dur="1.3s" begin="-0.3s" repeatCount="indefinite"/><animate attributeName="y" values="60;45;85;35;70;50;60" dur="1.3s" begin="-0.3s" repeatCount="indefinite"/></rect>
<rect x="140" y="95" width="6" height="0" rx="3" fill="url(#vg1)"><animate attributeName="height" values="50;30;45;15;55;20;50" dur="1.0s" begin="-0.4s" repeatCount="indefinite"/><animate attributeName="y" values="45;65;50;80;40;75;45" dur="1.0s" begin="-0.4s" repeatCount="indefinite"/></rect>
<rect x="160" y="95" width="6" height="0" rx="3" fill="url(#vg1)"><animate attributeName="height" values="60;20;55;25;45;10;60" dur="1.5s" begin="-0.5s" repeatCount="indefinite"/><animate attributeName="y" values="35;75;40;70;50;85;35" dur="1.5s" begin="-0.5s" repeatCount="indefinite"/></rect>
<rect x="180" y="95" width="6" height="0" rx="3" fill="url(#vg1)"><animate attributeName="height" values="45;55;12;50;30;60;45" dur="1.2s" begin="-0.6s" repeatCount="indefinite"/><animate attributeName="y" values="50;40;83;45;65;35;50" dur="1.2s" begin="-0.6s" repeatCount="indefinite"/></rect>
<rect x="200" y="95" width="6" height="0" rx="3" fill="url(#vg1)"><animate attributeName="height" values="30;60;20;55;40;15;30" dur="1.4s" begin="-0.7s" repeatCount="indefinite"/><animate attributeName="y" values="65;35;75;40;55;80;65" dur="1.4s" begin="-0.7s" repeatCount="indefinite"/></rect>
<rect x="220" y="95" width="6" height="0" rx="3" fill="url(#vg1)"><animate attributeName="height" values="15;50;35;60;10;45;15" dur="1.1s" begin="-0.8s" repeatCount="indefinite"/><animate attributeName="y" values="80;45;60;35;85;50;80" dur="1.1s" begin="-0.8s" repeatCount="indefinite"/></rect>
<rect x="240" y="95" width="6" height="0" rx="3" fill="url(#vg1)"><animate attributeName="height" values="55;15;50;30;60;20;55" dur="1.3s" begin="-0.9s" repeatCount="indefinite"/><animate attributeName="y" values="40;80;45;65;35;75;40" dur="1.3s" begin="-0.9s" repeatCount="indefinite"/></rect>
</g>

<!-- Center: VIBE CODING text with glow -->
<text x="420" y="55" font-family="'Courier New',monospace" font-size="30" font-weight="bold" fill="url(#vg1)" text-anchor="middle" filter="url(#bglow)" opacity="0.3">VIBE CODING</text>
<text x="420" y="55" font-family="'Courier New',monospace" font-size="30" font-weight="bold" fill="url(#vg1)" text-anchor="middle">
  VIBE CODING
  <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
</text>
<text x="420" y="75" font-family="monospace" font-size="11" fill="#7c4dff" text-anchor="middle" opacity="0.7">headphones on · world off · code flows</text>

<!-- Right side wave bars (mirror) -->
<g filter="url(#vglow)">
<rect x="594" y="95" width="6" height="0" rx="3" fill="url(#vg1)"><animate attributeName="height" values="55;15;50;30;60;20;55" dur="1.3s" begin="-0.9s" repeatCount="indefinite"/><animate attributeName="y" values="40;80;45;65;35;75;40" dur="1.3s" begin="-0.9s" repeatCount="indefinite"/></rect>
<rect x="614" y="95" width="6" height="0" rx="3" fill="url(#vg1)"><animate attributeName="height" values="15;50;35;60;10;45;15" dur="1.1s" begin="-0.8s" repeatCount="indefinite"/><animate attributeName="y" values="80;45;60;35;85;50;80" dur="1.1s" begin="-0.8s" repeatCount="indefinite"/></rect>
<rect x="634" y="95" width="6" height="0" rx="3" fill="url(#vg1)"><animate attributeName="height" values="30;60;20;55;40;15;30" dur="1.4s" begin="-0.7s" repeatCount="indefinite"/><animate attributeName="y" values="65;35;75;40;55;80;65" dur="1.4s" begin="-0.7s" repeatCount="indefinite"/></rect>
<rect x="654" y="95" width="6" height="0" rx="3" fill="url(#vg1)"><animate attributeName="height" values="45;55;12;50;30;60;45" dur="1.2s" begin="-0.6s" repeatCount="indefinite"/><animate attributeName="y" values="50;40;83;45;65;35;50" dur="1.2s" begin="-0.6s" repeatCount="indefinite"/></rect>
<rect x="674" y="95" width="6" height="0" rx="3" fill="url(#vg1)"><animate attributeName="height" values="60;20;55;25;45;10;60" dur="1.5s" begin="-0.5s" repeatCount="indefinite"/><animate attributeName="y" values="35;75;40;70;50;85;35" dur="1.5s" begin="-0.5s" repeatCount="indefinite"/></rect>
<rect x="694" y="95" width="6" height="0" rx="3" fill="url(#vg1)"><animate attributeName="height" values="50;30;45;15;55;20;50" dur="1.0s" begin="-0.4s" repeatCount="indefinite"/><animate attributeName="y" values="45;65;50;80;40;75;45" dur="1.0s" begin="-0.4s" repeatCount="indefinite"/></rect>
<rect x="714" y="95" width="6" height="0" rx="3" fill="url(#vg1)"><animate attributeName="height" values="35;50;10;60;25;45;35" dur="1.3s" begin="-0.3s" repeatCount="indefinite"/><animate attributeName="y" values="60;45;85;35;70;50;60" dur="1.3s" begin="-0.3s" repeatCount="indefinite"/></rect>
<rect x="734" y="95" width="6" height="0" rx="3" fill="url(#vg1)"><animate attributeName="height" values="20;60;15;50;8;40;20" dur="1.1s" begin="-0.2s" repeatCount="indefinite"/><animate attributeName="y" values="75;35;80;45;87;55;75" dur="1.1s" begin="-0.2s" repeatCount="indefinite"/></rect>
<rect x="754" y="95" width="6" height="0" rx="3" fill="url(#vg1)"><animate attributeName="height" values="12;55;8;40;20;50;12" dur="1.4s" begin="-0.1s" repeatCount="indefinite"/><animate attributeName="y" values="83;40;87;55;75;45;83" dur="1.4s" begin="-0.1s" repeatCount="indefinite"/></rect>
<rect x="774" y="95" width="6" height="0" rx="3" fill="url(#vg1)"><animate attributeName="height" values="8;45;20;55;12;35;8" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="87;50;75;40;83;60;87" dur="1.2s" repeatCount="indefinite"/></rect>
</g>

<!-- Floating headphone icon (simple) -->
<g opacity="0.3">
  <ellipse cx="420" cy="25" rx="18" ry="12" fill="none" stroke="#e040fb" stroke-width="2"/>
  <rect x="400" y="22" width="8" height="12" rx="3" fill="#e040fb"/>
  <rect x="432" y="22" width="8" height="12" rx="3" fill="#e040fb"/>
</g>
</svg>
